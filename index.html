<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TravelMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF6F1; --surface:#FFFFFF; --surface-2:#F5EEE6; --line:#EADFD3;
  --ink:#3A1F14; --ink-2:#6E5A4E; --ink-3:#9A887C;
  --brand:#E2692A; --brand-dk:#C4561C; --brand-soft:#FCEADF; --brand-line:#F3C3A4;
  --ok:#2F7A4B; --ok-soft:#E5F2E7; --warn:#A8670E; --warn-soft:#FBF0DC; --bad:#B4382B; --bad-soft:#FBE6E2;
  --radius:18px; --shadow:0 1px 2px rgba(58,31,20,.06),0 6px 20px rgba(58,31,20,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#E9E1D8;
  display:flex;align-items:center;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- device shell ---------- */
.device{width:390px;height:844px;background:var(--bg);border-radius:48px;position:relative;overflow:hidden;
  box-shadow:0 0 0 10px #1d1410,0 0 0 11px #3b2d25,0 30px 80px rgba(0,0,0,.35)}
.statusbar{position:absolute;top:0;left:0;right:0;height:47px;display:flex;align-items:center;justify-content:space-between;
  padding:0 30px 0 36px;font-weight:700;font-size:15px;z-index:30;pointer-events:none;background:var(--bg)}
.statusbar .notch{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#120b08}
.statusbar .sb-r{display:flex;gap:6px;align-items:center}
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:47px 0 24px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#1d1410;opacity:.85;z-index:40;pointer-events:none}
@media (max-width:500px){
  body{background:var(--bg);display:block}
  .device{width:100%;height:100dvh;border-radius:0;box-shadow:none}
  .statusbar,.homebar{display:none}
  .scroll{padding-top:env(safe-area-inset-top)}
}

/* ---------- common ---------- */
.px{padding-left:20px;padding-right:20px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 6px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:-.2px}
.brand .logo{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center}
.brand .logo svg{width:18px;height:18px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--ink-2)}
.navbar{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 12px;position:sticky;top:0;z-index:20;background:rgba(250,246,241,.94);backdrop-filter:blur(10px)}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow)}
.iconbtn:active{transform:scale(.96)}
.navbar .ttl{flex:1;min-width:0}
.navbar .ttl b{display:block;font-size:17px;font-weight:800}
.navbar .ttl > span{display:block;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{font-size:27px;line-height:1.15;margin:6px 0 4px;font-weight:800;letter-spacing:-.5px}
.sub{color:var(--ink-2);font-size:14px;margin:0 0 16px;line-height:1.45}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);margin:0 16px 14px;padding:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-h h3{margin:0;font-size:15px;font-weight:800}
.label{font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.6px}
.muted{color:var(--ink-2)}
.tiny{font-size:12px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip svg{width:13px;height:13px}
.chip.brand{background:var(--brand-soft);color:var(--brand-dk)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:16px;font-weight:800;font-size:16px;
  background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(226,105,42,.3);transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface);color:var(--brand-dk);box-shadow:inset 0 0 0 1.5px var(--brand-line)}
.btn.sm{height:40px;font-size:14px;border-radius:12px;box-shadow:none}
.btn.ghost.sm{box-shadow:inset 0 0 0 1.5px var(--brand-line)}
.btn[disabled]{background:#D9CFC6;box-shadow:none;cursor:not-allowed}
.sticky-cta{position:sticky;bottom:0;padding:12px 16px 26px;background:linear-gradient(rgba(250,246,241,0),var(--bg) 30%);z-index:15}
.footer-cta{padding:10px 16px 12px;background:var(--bg);position:relative;z-index:15;box-shadow:0 -10px 16px -6px rgba(250,246,241,1)}
.footer-cta.solo{padding-bottom:30px}
@media (max-width:500px){.footer-cta.solo{padding-bottom:max(14px,env(safe-area-inset-bottom))}}
.divider{height:1px;background:var(--line);margin:14px 0}
.money{font-variant-numeric:tabular-nums}

/* ---------- form ---------- */
.field{display:flex;align-items:center;gap:12px;padding:10px 0}
.field .ic{width:36px;height:36px;border-radius:11px;background:var(--brand-soft);color:var(--brand-dk);display:grid;place-items:center;flex:none}
.field .fbody{flex:1;min-width:0}
.field .fbody .label{display:block;margin-bottom:2px}
.field input[type=text]{border:0;outline:0;background:transparent;font-weight:700;font-size:16px;width:100%;padding:0}
.dates{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:end}
.datebox{position:relative;margin-top:4px}
.datebox button{width:100%;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:10px 10px;font-weight:700;font-size:14px;background:var(--surface);text-align:left}
.datebox button svg{width:16px;height:16px;color:var(--brand-dk)}
.datebox input{position:absolute;left:0;bottom:0;width:100%;height:100%;opacity:0;pointer-events:none;border:0}
.dates .arrow{padding-bottom:11px;color:var(--ink-3)}
.nights{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.err{color:var(--bad);font-size:12px;font-weight:600;margin-top:6px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:32px;height:32px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center}
.stepper button[disabled]{opacity:.35;cursor:default}
.stepper b{min-width:14px;text-align:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.budget-in{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:14px;padding:6px 14px;margin-top:8px}
.budget-in:focus-within{border-color:var(--brand)}
.budget-in .cur{font-weight:700;color:var(--ink-3);font-size:14px;white-space:nowrap}
.budget-in input{border:0;outline:0;font-size:26px;font-weight:800;width:100%;background:transparent;padding:4px 0}
.quick{display:flex;gap:8px;margin-top:10px}
.quick button{flex:1;padding:8px 0;border-radius:10px;background:var(--surface-2);font-weight:700;font-size:13px;color:var(--ink-2)}
.quick button.on{background:var(--brand-soft);color:var(--brand-dk);box-shadow:inset 0 0 0 1.5px var(--brand-line)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 4px;border-radius:10px;font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(58,31,20,.12)}
.pref-q{font-size:13px;font-weight:700;margin:14px 0 8px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.pill.on{background:var(--brand-soft);color:var(--brand-dk);box-shadow:inset 0 0 0 1.5px var(--brand)}
.pill svg{width:14px;height:14px}
.switch{width:46px;height:28px;border-radius:999px;background:#D9CFC6;position:relative;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.switch.on{background:var(--brand)}
.switch.on::after{left:21px}
.toggle-row{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:4px 0}
.collapse-h{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.collapse-h .chev{transition:transform .2s;color:var(--ink-3)}
.collapse-h.open .chev{transform:rotate(180deg)}

/* ---------- tab bar ---------- */
.tabbar{display:flex;justify-content:space-around;padding:8px 10px 28px;background:var(--surface);border-top:1px solid var(--line)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--ink-3);width:80px}
.tabbar button.on{color:var(--brand)}
.tabbar svg{width:22px;height:22px}
@media (max-width:500px){.tabbar{padding-bottom:max(12px,env(safe-area-inset-bottom))}}

/* ---------- compare ---------- */
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);white-space:nowrap;color:var(--ink-2)}
.fchip.on{background:var(--ink);color:#fff;box-shadow:none}
.fchip svg{width:14px;height:14px}
.rec{background:linear-gradient(135deg,#FFF6EF,#FDE7D8);box-shadow:inset 0 0 0 1.5px var(--brand-line);border-radius:var(--radius);margin:0 16px 16px;padding:14px 16px}
.rec .rh{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.rec .rh .star{width:26px;height:26px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center}
.rec .rh .star svg{width:15px;height:15px;fill:#fff;stroke:none}
.rec ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.rec li{display:flex;gap:8px;font-size:13px;align-items:flex-start;line-height:1.35}
.rec li svg{width:16px;height:16px;color:var(--ok);margin-top:1px}
.rec .why{font-size:12px;color:var(--ink-2);margin-top:8px}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:4px 20px 10px}
.sec-h h2{font-size:17px;margin:0;font-weight:800}
.picker{display:flex;gap:6px}
.picker button{width:34px;height:34px;border-radius:10px;font-weight:800;font-size:13px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink-2);position:relative}
.picker button.on{background:var(--ink);color:#fff;box-shadow:none}
.picker button.off{opacity:.45}
.cmp{margin:0 16px 14px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.cmp-cols{display:grid;grid-template-columns:1fr 1fr}
.cmp-col{padding:12px 12px 14px;min-width:0;position:relative}
.cmp-col + .cmp-col{border-left:1px solid var(--line)}
.cmp-col.is-rec{background:linear-gradient(#FFF8F3,#fff 120px)}
.cmp-col .ph{height:84px;border-radius:12px;background-size:cover;background-position:center;margin-bottom:10px;position:relative}
.cmp-col .ph .badge{position:absolute;left:6px;top:6px;font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:999px;background:rgba(255,255,255,.95);color:var(--brand-dk)}
.cmp-col .pname{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:15px}
.cmp-col .total{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
.cmp-col .left{font-size:12.5px;font-weight:700;color:var(--ok);margin-top:1px}
.cmp-col .left.bad{color:var(--bad)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;min-height:24px}
.tags .chip{font-size:11px;padding:4px 8px}
.cmp-row{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.cmp-row > div{padding:10px 12px;min-width:0}
.cmp-row > div + div{border-left:1px solid var(--line)}
.cmp-row .rl{grid-column:1/-1;padding:8px 12px 0;font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:6px;border:0}
.cmp-row .rl svg{width:14px;height:14px}
.cmp-row .rl + div{border-left:0}
.cmp-row .v{font-weight:700;font-size:13.5px;line-height:1.3}
.cmp-row .s{font-size:12px;color:var(--ink-2);margin-top:2px;line-height:1.35}
.cmp-row .better{color:var(--ok)}
.cmp-row .worse{color:var(--warn)}
.cmp-foot{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;border-top:1px solid var(--line);background:#FFFCF9}
.summary-line{margin:0 16px 16px;padding:12px 14px;border-radius:14px;background:var(--surface-2);font-size:13px;line-height:1.45;display:flex;gap:10px}
.summary-line svg{color:var(--brand-dk);margin-top:1px}
.pk{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);margin:0 16px 10px;padding:10px;text-align:left;width:calc(100% - 32px)}
.pk .thumb{width:64px;height:64px;border-radius:12px;background-size:cover;background-position:center;flex:none}
.pk .pb{flex:1;min-width:0}
.pk .pt{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.pk .pt .money{font-size:16px}
.pk .ps{font-size:12px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .pr{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.pk.dim{opacity:.62}
.pk:active{transform:scale(.99)}
.pk .cmpbox{width:24px;height:24px;border-radius:7px;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;flex:none}
.pk .cmpbox.on{background:var(--ink);color:#fff;box-shadow:none}
.pk .cmpbox svg{width:15px;height:15px}
.hidden-note{margin:4px 20px 12px;font-size:12.5px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.footnote{text-align:center;font-size:11px;color:var(--ink-3);margin:6px 20px 10px;line-height:1.5}

/* ---------- details ---------- */
.pos{color:var(--ok)} .neg{color:var(--bad)}
.acc{padding:14px 14px 14px}
.acc-h{display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.acc-ic{width:44px;height:44px;border-radius:13px;background:var(--brand-soft);color:var(--brand-dk);display:grid;place-items:center;flex:none}
.acc-ic svg{width:21px;height:21px}
.acc-thumb{width:44px;height:44px;border-radius:13px;background-size:cover;background-position:center;flex:none}
.acc-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.acc-b b{font-size:15px}
.acc-b .tiny{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-p{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.acc-p b{font-size:17px}
.more{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:12px;padding:9px;border-radius:12px;background:var(--surface-2);font-size:13px;font-weight:700;color:var(--ink-2)}
.more .chev{width:16px;height:16px;transition:transform .2s}
.acc.open .more .chev{transform:rotate(180deg)}
.acc-body{margin-top:14px}
.leg{border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.leg-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.leg-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.leg-row b{display:block;font-size:19px}
.leg-row span{display:block;font-weight:700;font-size:13px}
.leg-row small{display:block;font-size:11.5px;color:var(--ink-3)}
.leg-line{position:relative;text-align:center;font-size:11.5px;color:var(--ink-2);font-weight:700;padding-bottom:14px}
.leg-line::after{content:"";position:absolute;left:0;right:0;bottom:5px;height:2px;background:repeating-linear-gradient(90deg,var(--brand-line) 0 6px,transparent 6px 10px)}
.leg-line span{font-weight:700;font-size:11.5px}
.layover{display:flex;gap:8px;align-items:center;margin-top:10px;padding:8px 10px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:12.5px;font-weight:700}
.layover svg{width:15px;height:15px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.facts > div{display:flex;gap:8px;padding:10px;border-radius:12px;background:var(--surface-2);font-size:12px;color:var(--ink-2);line-height:1.35}
.facts > div svg{width:16px;height:16px;color:var(--brand-dk);margin-top:1px}
.facts b{display:block;color:var(--ink);font-size:12.5px}
.facts .okc{background:var(--ok-soft)} .facts .okc svg,.facts .okc b{color:var(--ok)}
.facts .warnc{background:var(--warn-soft)} .facts .warnc svg,.facts .warnc b{color:var(--warn)}
.fit{display:flex;gap:9px;padding:10px 12px;border-radius:12px;font-size:12.5px;line-height:1.45}
.fit svg{width:17px;height:17px;margin-top:1px}
.fit.ok{background:var(--ok-soft);color:#24553A} .fit.ok svg{color:var(--ok)}
.fit.warn{background:var(--warn-soft);color:#7A4A08} .fit.warn svg{color:var(--warn)}
.source{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12px;color:var(--ink-2)}
.source > svg{width:15px;height:15px;color:var(--ok)}
.source > span{flex:1}
.source button{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--brand-dk);font-size:12.5px}
.source button svg{width:13px;height:13px}
.keep{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.keep > span{display:flex;gap:10px;align-items:center}
.keep > span > svg{color:var(--brand-dk)}
.keep b{display:block;font-size:14px}
.keep small{display:block;font-size:12px;color:var(--ink-2)}
.gallery{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:70px 70px;gap:6px;margin-bottom:6px}
.gallery div{border-radius:12px;background-size:cover;background-position:center}
.gallery .big{grid-row:1/3}
.gallery div:only-child{grid-column:1/-1}
.sub-h{font-size:13px;font-weight:800;margin:16px 0 8px}
.room{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--line);margin-bottom:8px}
.room.on{box-shadow:inset 0 0 0 2px var(--brand);background:#FFF8F3}
.radio{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 2px #CDBFB3;flex:none;position:relative;display:inline-block}
.room.on .radio,.radio.on{box-shadow:inset 0 0 0 2px var(--brand)}
.room.on .radio::after,.radio.on::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--brand)}
.room .rb{flex:1}
.room b{display:block;font-size:14px}
.room small{display:block;font-size:12px;color:var(--ink-2);margin-top:1px}
.room .rp{text-align:right}
.nightly{border-radius:14px;background:var(--surface-2);padding:6px 12px}
.nightly > div{display:flex;justify-content:space-between;font-size:13px;padding:5px 0}
.nightly > div span{color:var(--ink-2)}
.nightly .tot{border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
.nightly .tot span{color:var(--ink);font-weight:700}
.map{width:100%;height:auto;border-radius:14px;display:block}
.spots{display:grid;gap:2px;margin-top:8px}
.spots > div{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 2px;border-bottom:1px dashed var(--line)}
.spots > div:last-child{border-bottom:0}
.spots span{display:flex;gap:8px;align-items:center;color:var(--ink-2)}
.spots svg{width:15px;height:15px;color:var(--brand-dk)}
.bline{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:5px 0}
.bline span{display:flex;gap:8px;align-items:center;color:var(--ink-2)}
.bline span svg{width:16px;height:16px}
.bline.big{font-weight:800;font-size:15px}
.bline.big span{color:var(--ink)}
.bline.big b{font-size:20px}
.bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:10px 0 6px}
.bar span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand),#F08A4B)}
.bar span.over{background:var(--bad)}
.linkbtn{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:10px;padding:12px;border-radius:12px;background:var(--brand-soft);color:var(--brand-dk);font-weight:700;font-size:13.5px}
.bar-cta{display:flex;align-items:center;gap:14px;border-top:1px solid var(--line);box-shadow:none}
.bar-cta > div{display:flex;flex-direction:column;min-width:96px}
.bar-cta > div b{font-size:20px;line-height:1.1}
.bar-cta .btn{flex:1}
/* change hotel */
.kept{display:flex;gap:12px;align-items:center;margin:0 16px 12px;padding:12px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--ok-soft),var(--shadow)}
.kept b{font-size:14px}
.hcard{display:flex;flex-direction:column;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);margin:0 16px 12px;overflow:hidden;cursor:pointer}
.hcard.on{box-shadow:0 0 0 2px var(--brand),var(--shadow)}
.hcard.dim{opacity:.55}
.hph{height:104px;background-size:cover;background-position:center;position:relative}
.hph .badge{position:absolute;left:10px;top:10px;font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.95);color:var(--ink)}
.hb{padding:10px 14px 12px}
.hb .pt{display:flex;justify-content:space-between;align-items:center}
.hb .pt b{font-size:16px}
.hrow{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.hrow b{font-size:16px}
.eq{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.eq span{display:flex;flex-direction:column}
.eq small{font-size:11px;color:var(--ink-3);font-weight:600}
.eq b{font-size:15px}
.eq i{font-style:normal;color:var(--ink-3);font-weight:700}
.eq .nt b{color:var(--brand-dk)}
.footer-cta.solo{border-top:1px solid var(--line);box-shadow:none}

/* budget page */
.stack{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.stack span{height:100%}
.stack-mark{position:absolute;top:0;bottom:-6px;border-left:2px dashed var(--ink);}
.stack-mark span{position:absolute;top:-2px;right:4px;font-size:10.5px;font-weight:700;white-space:nowrap;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:11.5px;color:var(--ink-2);font-weight:600}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.card-h h3{display:flex;align-items:center;gap:8px}
.card-h h3 svg{width:17px;height:17px;color:var(--brand-dk)}
.act{display:flex;align-items:center;gap:12px;width:100%;padding:10px 4px;border-bottom:1px dashed var(--line)}
.act:last-child{border-bottom:0}
.act b{display:block;font-size:14px}
.act small{display:block;font-size:11.5px;color:var(--ink-2);font-weight:500}
.cbox{width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 1.5px #CDBFB3;display:grid;place-items:center;flex:none}
.act.on .cbox{background:var(--brand);box-shadow:none;color:#fff}
.cbox svg{width:15px;height:15px}
/* review */
.banner{height:118px;margin:0 16px 14px;border-radius:var(--radius);background-size:cover;background-position:center 40%;display:flex;flex-direction:column;justify-content:flex-end;padding:14px 16px;color:#fff;position:relative}
.banner b{font-size:24px;font-weight:800;letter-spacing:-.4px;text-shadow:0 1px 8px rgba(0,0,0,.3)}
.banner span{font-size:13px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.banner.sm{height:104px;margin:0;border-radius:var(--radius) var(--radius) 0 0}
.rv{padding:14px 16px}
.rv-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.rv-h span{display:flex;gap:8px;align-items:center;font-weight:800;font-size:14.5px}
.rv-h span svg{color:var(--brand-dk);width:17px;height:17px}
.rv-h button{font-weight:700;font-size:13px;color:var(--brand-dk);padding:5px 12px;border-radius:999px;background:var(--brand-soft)}
.rv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.rv-grid small,.rv-row small{display:block;font-size:12px;color:var(--ink-2);line-height:1.45}
.rv-grid b{display:block;font-size:14px}
.rv-row{display:flex;justify-content:space-between;gap:10px}
.rv-row b{font-size:14px}
.rv-p{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.rv-p b{font-size:16px}
.rv-p small{white-space:nowrap}

.step span:nth-child(2){flex:1}

.step small{display:block;font-size:12px;color:var(--ink-2)}

.step > svg{color:var(--brand-dk)}

.empty > svg{width:44px;height:44px;color:var(--ink-3)}
.empty b{color:var(--ink);font-size:17px}
.empty span{font-size:13.5px;line-height:1.5}

.trow b{font-size:14px}
.trow small{display:block;font-size:12px;color:var(--ink-2);line-height:1.4}

.alert-card b{display:block;font-size:14px;color:#6E4305}
.alert-card small{display:block;font-size:12.5px;color:#7A4A08;line-height:1.4;margin-top:2px}

.chg s{color:var(--ink-3)}
.chg small{display:block;font-size:12px;color:var(--ink-2)}
.aff{display:flex;gap:10px;padding:9px 10px;border-radius:12px;margin-bottom:6px;font-size:13px}
.aff svg{width:17px;height:17px;margin-top:1px}
.aff b{display:block}
.aff small{display:block;font-size:12px;color:var(--ink-2);margin-top:1px;line-height:1.4}
.aff.bad{background:var(--warn-soft)} .aff.bad svg{color:var(--warn)}
.aff.ok{background:var(--surface-2)} .aff.ok svg{color:var(--ok)}
.opt{display:flex;gap:12px;align-items:flex-start;width:calc(100% - 32px);margin:0 16px 10px;padding:14px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
.opt.on{box-shadow:0 0 0 2px var(--brand),var(--shadow)}
.opt b{display:block;font-size:14.5px}
.opt small{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.45;margin-top:3px}
.opt .radio{margin-top:2px}

/* ---------- sheets / toast ---------- */
.toast{position:absolute;left:16px;right:16px;top:104px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-size:13px;font-weight:600;
  display:flex;gap:10px;align-items:center;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tin .2s ease-out}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
.toast.stay{animation:none}

.loading{position:absolute;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:40px}
.loading .spin{width:54px;height:54px;border-radius:50%;border:5px solid var(--brand-soft);border-top-color:var(--brand);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loading b{font-size:18px}
.loading .steps{display:grid;gap:8px;font-size:13px;color:var(--ink-2);text-align:left}
.loading .steps div{display:flex;gap:8px;align-items:center}
.loading .steps svg{width:16px;height:16px;color:var(--ok)}
.placeholder{margin:40px 24px;text-align:center;color:var(--ink-2)}

};

function extrasCost(n){
  const days = n + 1, a = S.trip.adults, e = S.extras;
  const food = FOOD[e.food][0] * days * a;
  const transit = (e.transit * days + 30) * a; // daily IC card + airport round trip
  const acts = e.acts.reduce((s,id)=>s + ACTS.find(x=>x.id===id).price, 0) * a;
  return {food, transit, acts, sum: food + transit + acts, days};
}

/* =========================================================
   Helpers / model
   ========================================================= */
const $ = n => '$' + Math.round(Math.abs(n)).toLocaleString('en-US');
const dur = m => `${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m`;
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fmtD = s => { const d = parseD(s); return `${MONTHS[d.getMonth()]} ${d.getDate()}`; };
function nights(){
  if(!S.trip.checkIn || !S.trip.checkOut) return 0;
  return Math.round((parseD(S.trip.checkOut) - parseD(S.trip.checkIn)) / 864e5);
}
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmtDay = s => { if(!s) return 'Select'; const d = parseD(s); return `${DAYS[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}`; };
const dateRange = () => `${fmtD(S.trip.checkIn)}–${fmtD(S.trip.checkOut).replace(MONTHS[parseD(S.trip.checkIn).getMonth()]+' ','')}`;
function roomMatches(room){
  if(S.prefs.room==='twin') return room.beds >= 2;
  if(S.prefs.room==='one') return room.beds === 1;
  return true;
}
function roomIndex(pid){
  const h = HOTELS[PLAN_DEF[pid].hotel];
  if(S.roomPick[pid] != null) return S.roomPick[pid];
  const i = h.rooms.findIndex(roomMatches);
  return i < 0 ? 0 : i;
}
function hotelCost(room, n){ let t=0; for(let i=0;i<n;i++) t += room.rates[i % room.rates.length]; return t; }
function combo(fid, hid, ri){
  const f = FLIGHTS[fid], h = HOTELS[hid];
  const room = h.rooms[Math.min(ri, h.rooms.length-1)], n = nights();
  const hotelTotal = hotelCost(room, n);
  const total = f.price + hotelTotal;
  return {f, h, room, ri, n, hotelTotal, perNight: Math.round(hotelTotal/Math.max(n,1)), total, left: S.trip.budget - total};
}
function plan(pid){ return {id:pid, ...combo(PLAN_DEF[pid].flight, PLAN_DEF[pid].hotel, roomIndex(pid))}; }
function cur(){ const c = S.cur; return {id:c.base, custom:c.hotel!==PLAN_DEF[c.base].hotel, ...combo(c.flight, c.hotel, c.room)}; }
function bestRoom(h){ const i = h.rooms.findIndex(roomMatches); return i < 0 ? 0 : i; }
function nightDates(){
  const out = [], d0 = parseD(S.trip.checkIn);
  for(let i=0;i<nights();i++){ const d = new Date(d0); d.setDate(d0.getDate()+i); out.push(`${DAYS[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}`); }
  return out;
}
function mismatch(p){
  const r = [];
  if(p.left < 0) r.push(`Over budget by ${$(p.left)}`);
  if(S.prefs.stops==='nonstop' && p.f.stops>0) r.push('Has 1 stop');
  if(S.prefs.nearStation && p.h.walk>5) r.push(`${p.h.walk} min to station`);
  if(S.prefs.areas.length && !S.prefs.areas.includes(p.h.area)) r.push(`Not in ${S.prefs.areas.join(' / ')}`);
  if(S.prefs.room!=='any' && !p.h.rooms.some(roomMatches)) r.push(S.prefs.room==='twin' ? 'No room with 2 beds' : 'No room with 1 large bed');
  return r;
}
const score = {
  balanced: p => p.left/40 - p.f.stops*12 - (p.f.lateArrival?8:0) - p.h.walk*1.2 + p.h.rating*4 + (p.h.freeCancel?4:0),
  price:    p => p.left,
  travel:   p => -p.f.mins - p.f.price/1000,
  location: p => -p.h.walk*10 + p.h.rating*5,
};
function ranked(){
  const all = Object.keys(PLAN_DEF).map(plan);
  const fit = all.filter(p => !mismatch(p).length).sort((a,b)=>score[S.prefs.priority](b)-score[S.prefs.priority](a));
  const out = all.filter(p => mismatch(p).length);
  return {fit, out, rec: fit[0] || null};
}
function recReasons(p){
  const r = [];
  if(p.f.stops===0) r.push(`Nonstop flight · ${dur(p.f.mins)} to Tokyo`);
  else r.push(`1 stop via ${p.f.via.split(' ')[0]} · ${p.f.layover} layover`);
  r.push(`${p.h.walk} min walk to ${p.h.station} · ${p.h.area}`);
  r.push(p.left >= 0 ? `Leaves ${$(p.left)} of your budget for food and activities` : `Over budget by ${$(p.left)}`);
  if(p.h.freeCancel) r.push(p.h.cancel);
  return r.slice(0,3);
}
const PRIORITY_TXT = {balanced:'the best balance of price, travel time and location', price:'the lowest total price', travel:'the shortest travel time', location:'the most convenient hotel location'};

function diffTags(a, b){
  const t = [];
  if(a.total < b.total) t.push(['ok', `Saves ${$(b.total-a.total)}`]);
  if(a.f.stops===0 && b.f.stops>0) t.push(['ok','Direct flight']);
  if(a.f.stops>0) t.push(['warn', `1 stop · ${a.f.layover}`]);
  if(a.f.stops===b.f.stops && a.f.mins + 60 < b.f.mins) t.push(['ok', `${Math.round((b.f.mins-a.f.mins)/60)}h shorter trip`]);
  if(a.h.walk + 2 <= b.h.walk) t.push(['ok','Closer to station']);
  if(a.room.size >= b.room.size + 4) t.push(['ok', `Bigger room (+${a.room.size-b.room.size} m²)`]);
  if(a.h.freeCancel && !b.h.freeCancel) t.push(['ok','Free cancellation']);
  if(!a.h.freeCancel) t.push(['warn','Non-refundable hotel']);
  if(a.f.lateArrival) t.push(['warn','Arrives 21:40']);
  if(a.total > b.total && !t.length) t.push(['warn', `${$(a.total-b.total)} more`]);
  return t.slice(0,3);
}

function flightLeg(label, leg, f, isOut){
  const mins = isOut ? f.mins : f.ret.mins;
  return `<div class="leg">
    <div class="leg-h"><span class="label">${label}</span><span class="tiny muted">${isOut?f.code:f.ret.code} · ${dur(mins)}</span></div>
    <div class="leg-row">
      <div><b>${leg.dep.split(' · ')[1]}</b><span>${leg.depA}</span><small>${leg.dep.split(' · ')[0]}</small></div>
      <div class="leg-line"><span>${f.stops ? '1 stop · '+f.via.match(/\((\w+)\)/)[1] : 'Nonstop'}</span></div>
      <div style="text-align:right"><b>${leg.arr.split(' · ')[1]}</b><span>${leg.arrA}</span><small>${leg.arr.split(' · ')[0]}</small></div>

}

          : `Lands at <b>${arrive}</b> on ${f.out.arr.split(' · ')[0]}. ${h.name} check-in starts at ${h.checkin}, about ${(SPOTS[h.id].find(s=>s[0].startsWith('Haneda'))||['','45 min'])[1]} from the airport by train.`}</span></div>

          <div class="tot"><span>${p.n} nights · taxes included</span><b class="money">${$(p.hotelTotal)}</b></div></div>

function screenHotels(){
  const c = S.cur, t = S.trip, f = FLIGHTS[c.flight], current = cur();
  const pick = S.hotelPick || c.hotel;
  const room = S.hotelRoom;
  const list = Object.values(HOTELS).map(h => {
    let ri = h.rooms.findIndex(r => room==='twin' ? r.beds>=2 : room==='one' ? r.beds===1 : true);
    if(h.id===c.hotel && (room==='any' || (room==='twin' ? h.rooms[c.room].beds>=2 : h.rooms[c.room].beds===1))) ri = c.room;
    const ok = ri >= 0; const cb = combo(c.flight, h.id, ok?ri:0);
    return {h, ri:ok?ri:0, ok, ...cb};
  });
  const sorters = {price:(a,b)=>a.hotelTotal-b.hotelTotal, walk:(a,b)=>a.h.walk-b.h.walk, rating:(a,b)=>b.h.rating-a.h.rating};
  list.sort((a,b)=> (b.ok - a.ok) || sorters[S.hotelSort](a,b));
  const sel = list.find(x=>x.h.id===pick) || list[0];
  const remain = t.budget - f.price;
  return `
  <div class="scroll" id="scroll">
    <div class="navbar">
      <button class="iconbtn" data-act="back" aria-label="Cancel">${ic('x')}</button>
      <div class="ttl"><b>Change hotel</b><span>Your flight stays the same · ${current.n} nights</span></div>
    </div>
    <div class="kept">
      <span class="acc-ic">${ic('plane')}</span>
      <div style="flex:1;min-width:0"><b>${f.airline} · ${f.stops?'1 stop':'Nonstop'}</b><span class="tiny muted" style="display:block">${f.out.dep} → ${f.out.arr} · ${$(f.price)}</span></div>
      <span class="chip ok">${ic('lock')} Flight kept</span>
    </div>
    <div class="summary-line" style="margin-top:2px">${ic('wallet')}<span><b>${$(remain)}</b> of your ${$(t.budget)} budget is left for the hotel (${current.n} nights) and the rest of your trip.</span></div>
    <div class="px" style="margin-bottom:8px"><div class="label" style="margin-bottom:6px">Room</div>
      <div class="seg">${[['any','Any room'],['twin','2 separate beds'],['one','1 large bed']].map(([v,l])=>`<button data-act="hroom" data-v="${v}" class="${room===v?'on':''}">${l}</button>`).join('')}</div></div>
    <div class="px" style="display:flex;align-items:center;gap:8px;margin:12px 0 10px"><span class="label">Sort</span>
      ${[['price','Lowest price'],['walk','Closest to station'],['rating','Top rated']].map(([v,l])=>`<button class="fchip ${S.hotelSort===v?'on':''}" data-act="hsort" data-v="${v}">${l}</button>`).join('')}</div>
    ${list.map(x => { const on = x.h.id===sel.h.id, isCur = x.h.id===c.hotel && x.ri===c.room; const diff = x.hotelTotal - current.hotelTotal; return `
      <div class="hcard ${on?'on':''} ${x.ok?'':'dim'}" data-act="hpick" data-v="${x.h.id}" role="radio" aria-checked="${on}" tabindex="0">
        <div class="hph" style="background-image:url(${x.h.img})">${isCur?'<span class="badge">Current hotel</span>':''}</div>
        <div class="hb">
          <div class="pt"><b>${x.h.name}</b><span class="radio ${on?'on':''}"></span></div>
          <div class="tiny muted">${x.h.area} · ${x.h.walk} min walk to ${x.h.station} · ★ ${x.h.rating}</div>
          <div class="tiny" style="margin-top:4px">${x.ok ? `${x.room.name} · ${x.room.size} m² · <b>${$(x.perNight)}</b>/night` : `<span class="neg" style="font-weight:700">No room with ${room==='twin'?'2 separate beds':'1 large bed'}</span>`}</div>
          <div class="hrow">
            <span><span class="tiny muted">Hotel total</span> <b class="money">${$(x.hotelTotal)}</b></span>
            ${isCur ? '<span class="chip">Current</span>' : diff===0 ? '<span class="chip">Same price</span>' : diff<0 ? `<span class="chip ok">Save ${$(diff)}</span>` : `<span class="chip warn">+${$(diff)} vs current</span>`}
          </div>
          <div class="tiny money" style="margin-top:4px;font-weight:700"><span class="${x.left<0?'neg':'pos'}">${x.left<0?'Trip over budget by '+$(x.left):'Trip total '+$(x.total)+' · '+$(x.left)+' left'}</span></div>
        </div>
      </div>`; }).join('')}
  </div>
  <div class="footer-cta solo">
    <div class="eq"><span><small>Flight</small><b class="money">${$(f.price)}</b></span><i>+</i><span><small>Hotel</small><b class="money">${$(sel.hotelTotal)}</b></span><i>=</i><span class="nt"><small>New total</small><b class="money">${$(sel.total)}</b></span>
      <span class="chip ${sel.left<0?'bad':'ok'}" style="margin-left:auto">${sel.left<0?'Over '+$(sel.left):$(sel.left)+' left'}</span></div>
    <button class="btn" data-act="hsave" ${!sel.ok?'disabled':''}>${sel.h.id===c.hotel && sel.ri===c.room ? 'Keep current hotel' : 'Save hotel change'}</button>
  </div>`;
}

/* ---------- full-trip budget (A2 Change 6, DR1) ---------- */
function stackBar(parts, budget){
  const total = parts.reduce((s,p)=>s+p[1],0), scale = Math.max(total, budget);
  return `<div class="stack">${parts.map(([k,v])=>`<span style="width:${v/scale*100}%;background:${SEG_COLORS[k]}"></span>`).join('')}</div>
    <div class="stack-mark" style="left:${budget/scale*100}%"><span>Budget ${$(budget)}</span></div>`;
}

  const full = p.total + x.sum, left = t.budget - full;

  return `
  <div class="scroll" id="scroll">
    <div class="navbar">
      <button class="iconbtn" data-act="back" aria-label="Back">${ic('left')}</button>

      <div style="display:flex;align-items:baseline;justify-content:space-between;margin:2px 0 10px">

      ${left<0 ? `<div class="fit warn" style="margin-top:12px">${ic('alert')}<span>Flights and hotel fit your budget, but the whole trip is about <b>${$(left)}</b> over. Try a lower food level, fewer activities, or a cheaper hotel.</span></div>` : ''}
    </div>

    <div class="card">
      <div class="card-h"><h3>Booked in this plan</h3><span class="chip">${ic('lock')} Fixed</span></div>
      <div class="bline"><span>${ic('plane')} Flights for ${t.adults}</span><b class="money">${$(p.f.price)}</b></div>
      <div class="bline"><span>${ic('bed')} ${p.h.name} · ${p.n} nights</span><b class="money">${$(p.hotelTotal)}</b></div>
    </div>

    <div class="card">
      <div class="card-h"><h3>${ic('tag')} Food</h3><b class="money">${$(x.food)}</b></div>
      <div class="seg">${Object.entries(FOOD).map(([k,v])=>`<button data-act="food" data-v="${k}" class="${e.food===k?'on':''}">${v[1]} · $${v[0]}</button>`).join('')}</div>
      <div class="tiny muted" style="margin-top:8px">${FOOD[e.food][2]} · per person per day × ${t.adults} × ${x.days} days</div>
    </div>

    <div class="card">
      <div class="card-h"><h3>${ic('train')} Local transit</h3><b class="money">${$(x.transit)}</b></div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <span style="font-size:13.5px">Trains and subway per person / day</span>
        <div class="stepper"><button data-act="transit" data-d="-2" ${e.transit<=2?'disabled':''} aria-label="Less transit">${ic('minus')}</button><b class="money" style="min-width:34px">$${e.transit}</b><button data-act="transit" data-d="2" ${e.transit>=30?'disabled':''} aria-label="More transit">${ic('plus')}</button></div>
      </div>
      <div class="tiny muted" style="margin-top:8px">Includes the airport train both ways ($30 per person). Your hotel is ${p.h.walk} min from ${p.h.station}.</div>
    </div>

    <div class="card">
      <div class="card-h"><h3>${ic('star')} Activities</h3><b class="money">${$(x.acts)}</b></div>
      ${ACTS.map(a=>{ const on = e.acts.includes(a.id); return `

/* ---------- saved trip helpers ---------- */
function savedCalc(){
  const s = S.saved, f = FLIGHTS[s.flight], h = HOTELS[s.hotel], room = h.rooms[s.room];
  let hotelTotal = 0; for(let i=0;i<s.n;i++) hotelTotal += room.rates[(s.start+i) % room.rates.length];
  const total = f.price + hotelTotal;
  return {s, f, h, room, hotelTotal, total, left: s.budget - total};
}
const shiftDay = str => { const [d,t] = str.split(' · '); const [m,n] = d.split(' '); return `${m} ${+n+1} · ${t}`; };
const altFlight = fid => fid==='F2' ? 'F1' : 'F2';
function addDays(iso, k){ const d = parseD(iso); d.setDate(d.getDate()+k); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

/* =========================================================
   Render + events
   ========================================================= */
const app = document.getElementById('app');
function render(resetScroll){
  const sc = document.getElementById('scroll');
  const keep = !resetScroll && sc ? sc.scrollTop : 0;
  let html = '';
  switch(S.screen){
    case 'plan': html = screenPlan(); break;
    case 'compare': html = screenCompare(); break;
    case 'details': html = screenDetails(); break;
    case 'hotels': html = screenHotels(); break;
    case 'budget': html = screenBudget(); break;
    case 'review': html = screenReview(); break;
    case 'done': html = screenDone(); break;
    case 'impact': html = screenImpact(); break;
    case 'trips': html = screenTrips(); break;
    case 'me': html = screenMe(); break;
  }
  if(S.loading) html += `<div class="loading"><div class="spin"></div><b>Building packages for ${S.trip.to.split(',')[0]}…</b>
    <div class="steps"><div>${ic('check')} Checking flights from ${S.trip.from.match(/\((\w+)\)/)?.[1]||'YYZ'}</div><div>${ic('check')} Pricing ${nights()} hotel nights</div><div>${ic('check')} Matching your ${$(S.trip.budget)} budget</div></div></div>`;
  if(S.toast) html += `<div class="toast ${S.toastShown===S.toast?'stay':''}" role="status">${ic('info')}<span>${S.toast}</span></div>`;
  S.toastShown = S.toast;
  app.innerHTML = html;
  const nsc = document.getElementById('scroll');
  if(nsc) nsc.scrollTop = keep;
}

app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const act = el.dataset.act, v = el.dataset.v, k = el.dataset.k;
  switch(act){
    case 'back':
      if(S.screen==='budget' && S.extrasBackup){ S.extras = JSON.parse(S.extrasBackup); }
      back(); break;
    case 'pickdate': { const inp = document.getElementById(v); try{ inp.showPicker(); }catch(_){ inp.style.pointerEvents='auto'; inp.focus(); inp.click(); } break; }
    case 'tab': S.stack = []; S.screen = v; S.toast = null; render(true); break;
    case 'step': { const max = {adults:4, rooms:2}[k]; S.trip[k] = Math.min(max, Math.max(1, S.trip[k] + Number(el.dataset.d))); render(); break; }
    case 'budget': S.trip.budget = Number(v); render(); break;
    case 'prefs-toggle': S.prefsOpen = !S.prefsOpen; render(); break;
    case 'pref': S.prefs[k] = v; S.roomPick = {}; render(); break;
    case 'near': S.prefs.nearStation = !S.prefs.nearStation; render(); break;
    case 'area': { const a = S.prefs.areas; const i = a.indexOf(v); i<0 ? a.push(v) : a.splice(i,1); render(); break; }
    case 'prefs-reset': S.prefs = {stops:'any', nearStation:false, areas:[], room:'any', priority:'balanced'}; S.roomPick = {}; render(); break;
    case 'swapcity': toast('This demo plans trips from Toronto. Other origins are coming soon.'); break;
    case 'find': {
      const to = S.trip.to.toLowerCase();
      if(!to.includes('tokyo')){ toast('This demo has sample packages for Tokyo only. Please keep “Tokyo, Japan”.'); return; }
      S.loading = true; render();
      setTimeout(()=>{ S.loading = false; const {fit} = ranked();
        if(fit.length >= 2) S.compare = [fit[0].id, fit[1].id];
        else if(fit.length === 1) S.compare = [fit[0].id, Object.keys(PLAN_DEF).find(x=>x!==fit[0].id)];
        S.showHidden = false; go('compare'); }, 1100);
      break;
    }
    case 'editprefs': S.prefsOpen = true; back(); break;
    case 'clearpref': {
      if(k==='priority') S.prefs.priority='balanced'; if(k==='stops') S.prefs.stops='any'; if(k==='near') S.prefs.nearStation=false;
      if(k==='areas') S.prefs.areas=[]; if(k==='room') { S.prefs.room='any'; S.roomPick={}; }
      render(); break;
    }
    case 'cmp': {
      const c = S.compare;
      if(c.includes(v)){ toast('Pick another plan to replace it — two plans are always compared.'); return; }
      c.shift(); c.push(v); render(); break;
    }
    case 'showhidden': S.showHidden = !S.showHidden; render(); break;
    case 'view': {
      if(e.target.closest('.cmpbox')) return;
      S.cur = {base:v, flight:PLAN_DEF[v].flight, hotel:PLAN_DEF[v].hotel, room:roomIndex(v), keep:false};
      S.open = {flight:false, hotel:false};
      go('details'); break;
    }
    case 'acc': S.open[v] = !S.open[v]; render(); break;
    case 'keep': S.cur.keep = !S.cur.keep; if(S.cur.keep) toast(`Flight kept. Tap “Change hotel” to find a hotel that fits the remaining ${$(S.trip.budget - FLIGHTS[S.cur.flight].price)}.`); else render(); break;
    case 'room': S.cur.room = Number(v); S.roomPick[S.cur.base] = Number(v); render(); break;
    case 'ext': toast(`In the real app this opens ${v} in your browser to book or check details.`); break;
    case 'changehotel':
      if(!S.cur.keep){ S.cur.keep = true; }
      S.hotelPick = S.cur.hotel; S.hotelSort = 'price';
      S.hotelRoom = S.prefs.room !== 'any' ? S.prefs.room : (HOTELS[S.cur.hotel].rooms[S.cur.room].beds > 1 ? 'twin' : 'any');
      go('hotels'); break;
    case 'hpick': S.hotelPick = v; render(); break;
    case 'hsort': S.hotelSort = v; render(); break;
    case 'hroom': S.hotelRoom = v; render(); break;
    case 'hsave': {
      const h = HOTELS[S.hotelPick];
      const room = S.hotelRoom;
      let ri = h.rooms.findIndex(r => room==='twin' ? r.beds>=2 : room==='one' ? r.beds===1 : true);
      if(h.id===S.cur.hotel && (room==='any' || (room==='twin' ? h.rooms[S.cur.room].beds>=2 : h.rooms[S.cur.room].beds===1))) ri = S.cur.room;
      const changed = h.id!==S.cur.hotel || ri!==S.cur.room;
      S.cur.hotel = h.id; S.cur.room = Math.max(0, ri);
      S.screen = S.stack.pop() || 'details';
      render(true);
      if(changed){ const p = cur(); toast(`Hotel changed to ${h.name}. New total ${$(p.total)} · ${$(p.left)} left.`); }
      break;
    }
    case 'budgetpage': S.extrasBackup = JSON.stringify(S.extras); go('budget'); break;
    case 'review': go('review'); break;
    case 'food': S.extras.food = v; render(); break;
    case 'transit': S.extras.transit = Math.min(30, Math.max(2, S.extras.transit + Number(el.dataset.d))); render(); break;
    case 'actt': { const a = S.extras.acts, i = a.indexOf(v); i<0 ? a.push(v) : a.splice(i,1); render(); break; }
    case 'saveextras': S.extrasSaved = true; back(); toast('Estimates saved. They are included in your budget summary.'); break;
    case 'edit':
      if(v==='trip'){ S.stack = []; S.screen = 'plan'; render(true); toast('Change your trip details, then tap “Find trip options” again.'); }
      else if(v==='budget'){ S.extrasBackup = JSON.stringify(S.extras); go('budget'); }
      else { S.open = {flight:v==='flight', hotel:v==='hotel'}; back(); }
      break;
    case 'confirm': {
      const p = cur();
      S.saved = {base:p.id, flight:S.cur.flight, hotel:S.cur.hotel, room:S.cur.room, start:0, n:p.n,
        checkIn:S.trip.checkIn, checkOut:S.trip.checkOut, budget:S.trip.budget, change:null, applied:'', flightMoved:false, unusedNight:false};
      S.stack = []; S.screen = 'done'; S.toast = null; render(true); break;
    }
    case 'newtrip': S.stack = []; S.screen = 'plan'; render(true); break;
    case 'simulate': S.saved.change = 'pending'; S.saved.flightMoved = true; render(); toast(`New notification: ${FLIGHTS[S.saved.flight].airline} changed your flight.`); break;
    case 'impact': S.impactPick = 'shorten'; go('impact'); break;
    case 'ipick': S.impactPick = v; render(); break;
    case 'iapply': {
      const s = S.saved, h = HOTELS[s.hotel], first = h.rooms[s.room].rates[0];
      if(S.impactPick==='shorten'){
        s.start = 1; s.n -= 1; s.checkIn = addDays(s.checkIn, 1);
        s.applied = h.freeCancel ? `Hotel shortened to ${s.n} nights (${fmtD(s.checkIn)}–${fmtD(s.checkOut).split(' ')[1]}). You saved ${$(first)}.` : `Hotel shortened to ${s.n} nights. Contact ${h.name} about the non-refundable night.`;
      } else if(S.impactPick==='rebook'){
        s.flight = altFlight(s.flight); s.flightMoved = false;
        s.applied = `Rebooked to ${FLIGHTS[s.flight].code}. You still land ${FLIGHTS[s.flight].out.arr.split(' · ')[0]} and keep all ${s.n} hotel nights.`;
      } else {
        s.unusedNight = true; s.applied = `Kept as is. The night of ${fmtD(s.checkIn)} will be unused.`;
      }
      s.change = 'done'; S.stack = []; S.screen = 'trips'; render(true); toast('Trip updated.'); break;
    }
    case 'reset': {
      const fresh = JSON.parse(FRESH); Object.keys(S).forEach(k=>delete S[k]); Object.assign(S, fresh);
      S.screen = 'plan'; render(true); toast('Prototype reset. Ready for the next participant.'); break;
    }
  }
});
app.addEventListener('input', e => {
  const id = e.target.id;
  if(id==='f-budget'){
    const digits = e.target.value.replace(/[^\d]/g,'').slice(0,6);
    S.trip.budget = digits ? Number(digits) : 0;
    const pos = e.target.selectionStart; render();
    const inp = document.getElementById('f-budget'); inp.focus();
    try{ inp.setSelectionRange(inp.value.length, inp.value.length); }catch(_){}
  }
  if(id==='f-from') S.trip.from = e.target.value;
  if(id==='f-to') S.trip.to = e.target.value;
});
app.addEventListener('change', e => {
  const id = e.target.id;
  if(id==='f-in'){ S.trip.checkIn = e.target.value; render(); }
  if(id==='f-out'){ S.trip.checkOut = e.target.value; render(); }
});
render(true);
</script>
</body>
